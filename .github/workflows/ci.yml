name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: armorix
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: armorix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armorix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://armorix@127.0.0.1:5432/armorix_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @armorix/api test
      - run: pnpm --filter @armorix/admin build
